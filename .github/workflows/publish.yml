name: Publish

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-lint:
    uses: ./.github/workflows/test-lint.yml
    secrets: inherit

  publish:
    needs: test-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm nx build gleetchy
        env:
          VITE_BUILD_BASE: /gleetchy/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/gleetchy/dist
      - uses: actions/deploy-pages@v5
