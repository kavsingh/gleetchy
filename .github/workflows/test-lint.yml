name: Test and lint

on:
  push:
  workflow_call:

permissions:
  contents: read

jobs:
  test-lint:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run test -- --coverage --silent
      - run: pnpm run lint
